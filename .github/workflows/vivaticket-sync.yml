name: Vivaticket hourly sync

'on':
  schedule:
    # Once per hour at :17 UTC, away from the busy start of the hour.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vivaticket-sync
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Check out project
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Check Supabase secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os
          missing = [name for name in ('SUPABASE_URL', 'SUPABASE_SECRET_KEY')
                     if not os.environ.get(name, '').strip()]
          if missing:
              raise SystemExit('Add repository Actions secrets: ' + ', '.join(missing))
          print('Required secrets are configured.')
          PY

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest -v test_sync

      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Collect fresh ticket data and upload to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python sync.py --headless --wait 45

      - name: Save snapshot and run metadata
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ticket-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/*/snapshot.json
            output/*/run.json
          retention-days: 3
          if-no-files-found: ignore
